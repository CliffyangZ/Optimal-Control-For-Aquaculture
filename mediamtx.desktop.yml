logLevel: info

# Desktop relay configuration for Windows, macOS, and Linux.
rtsp: yes
rtspAddress: :8554
rtspTransports: [tcp]

rtmp: no
hls: no
webrtc: yes
webrtcAddress: :8889
webrtcAllowOrigins: ["*"]
webrtcLocalUDPAddress: :8189
webrtcAdditionalHosts: [localhost, 127.0.0.1]
srt: no

paths:
  # Smartphone or FFmpeg publisher target:
  # rtsp://<relay-host>:8554/drone_live
  drone_live:
    source: publisher
