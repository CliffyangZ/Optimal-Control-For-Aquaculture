dataset:
  roboflow_workspace: jtelectric
  roboflow_project: fishtracker_v2
  roboflow_version: 1
  roboflow_format: yolo26
  local_cache_dir: data/datasets/fishtracker_v2

model:
  weights: yolo26s.pt
  variant: yolo26s
  output_dir: runs/train
  epochs: 300
  batch: 16
  imgsz: 832
  workers: 4
  mosaic: 1.0
  close_mosaic: 10
  mixup: 0.2
  patience: 50
  seed: 42
  # Data augmentation
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  degrees: 10.0
  translate: 0.1
  scale: 0.5
  flipud: 0.1
  fliplr: 0.5

wandb:
  project: Aqua_CV_Project
  entity: sakuralittle
  log_val_images_every_n: 10

evaluation:
  thresholds:
    feed:
      map50: 0.70
      recall: 0.75
    fish:
      map50: 0.75
