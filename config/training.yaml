dataset:
  roboflow_workspace: jtelectric
  roboflow_project: fishtracker_v2
  roboflow_version: 1
  roboflow_format: yolo26
  local_cache_dir: data/datasets/fishtracker_v2
  n_folds: 5
  fold_output_dir: data/kfold

model:
  weights: yolo26s.pt
  variant: yolo26s
  epochs: 100
  batch: 8
  imgsz: 640
  workers: 4
  mosaic: 1.0
  close_mosaic: 10
  mixup: 0.1
  patience: 50
  seed: 42

wandb:
  project: Aqua_CV_Project
  entity: sakuralittle
  log_val_images_every_n: 10

evaluation:
  thresholds:
    feed:
      map50: 0.70
      recall: 0.75
    fish:
      map50: 0.75
