version: 1
created_for: low-latency-ripple-monitoring

# Example manifest template for prepared clip validation.
#
# Instructions:
# 1. Copy this file to clips.local.yml
# 2. Add local paths to video files (do not commit video files to git)
# 3. Organize clips by expected activity level
# 4. Include at least 3 Low, 3 Medium, 3 High, and 1 interference clip
# 5. Run: python -m validation.run_clip_validation --manifest src/validation/clips.local.yml

clips:
  # Low Activity Clips (3+ required)
  - id: low-001
    path: ./clips/calm-water-reference-1.mp4
    expected_activity: Low
    interference_labels: []
    notes: Calm water surface with minimal ripples

  - id: low-002
    path: ./clips/calm-water-reference-2.mp4
    expected_activity: Low
    interference_labels: []
    notes: Still water reference clip

  - id: low-003
    path: ./clips/calm-water-reference-3.mp4
    expected_activity: Low
    interference_labels: []
    notes: Water at rest

  # Medium Activity Clips (3+ required)
  - id: medium-001
    path: ./clips/moderate-ripples-1.mp4
    expected_activity: Medium
    interference_labels: []
    notes: Moderate ripple activity from gentle water movement

  - id: medium-002
    path: ./clips/moderate-ripples-2.mp4
    expected_activity: Medium
    interference_labels: []
    notes: Standard ripple test case

  - id: medium-003
    path: ./clips/moderate-ripples-3.mp4
    expected_activity: Medium
    interference_labels: []
    notes: Medium activity reference

  # High Activity Clips (3+ required)
  - id: high-001
    path: ./clips/active-ripples-1.mp4
    expected_activity: High
    interference_labels: []
    notes: Strong ripple activity from significant disturbance

  - id: high-002
    path: ./clips/active-ripples-2.mp4
    expected_activity: High
    interference_labels: []
    notes: High activity from water turbulence

  - id: high-003
    path: ./clips/active-ripples-3.mp4
    expected_activity: High
    interference_labels: []
    notes: Maximum ripple activity

  # Interference/Low-Confidence Clips (1+ required)
  - id: interference-001
    path: ./clips/too-dark-scene.mp4
    expected_activity: Detection Unavailable
    interference_labels: [too_dark]
    notes: Insufficient lighting, detection should be unavailable

  - id: interference-002
    path: ./clips/unstable-camera.mp4
    expected_activity: Detection Unavailable
    interference_labels: [unstable]
    notes: Camera motion or vibration, detection should be unreliable

  - id: interference-003
    path: ./clips/glare-reflection.mp4
    expected_activity: Detection Unavailable
    interference_labels: [glare]
    notes: Direct light reflection on water surface
